<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mein Briefing</title>
  <meta name="description" content="Tägliches Nachrichten-Briefing">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Briefing">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 id="title">Briefing</h1>
    <p id="subtitle" class="muted"></p>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="Hauptnavigation">
    <button type="button" data-view="today" class="active">Heute</button>
    <button type="button" data-view="archive">Archiv</button>
    <button type="button" data-view="settings">Einstellungen</button>
  </nav>

  <script src="app.js" defer></script>
</body>
</html>
