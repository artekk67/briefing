<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seite nicht gefunden</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f7; color: #1d1d1f; font: 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; text-align: center; padding: 24px; }
    a { color: #0066cc; }
    @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } a { color: #2997ff; } }
  </style>
</head>
<body>
  <p id="msg">Diese Seite gibt es nicht. <a id="home" href="./">Zum Briefing</a></p>
  <script>
    // GitHub Pages liefert diese Datei bei jeder unbekannten Adresse. Bei einem Projekt-Site-Pfad
    // (name.github.io/repo/...) geht es automatisch zur Startseite der App. Kein Weiterleiten, wenn
    // man schon dort ist, damit keine Schleife entsteht.
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var base = location.hostname.slice(-10) === '.github.io' && parts.length ? '/' + parts[0] + '/' : '/';
      document.getElementById('home').setAttribute('href', base);
      if (location.pathname !== base) location.replace(base);
    })();
  </script>
</body>
</html>
